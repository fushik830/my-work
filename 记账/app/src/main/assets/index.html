<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F9FB">
  <meta name="format-detection" content="telephone=no">
  <title>哦鲸鲸记账</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="whale" viewBox="0 0 96 96">
      <path d="M19 58c0-18 13-30 32-30 15 0 26 7 31 19 5-1 9-4 12-8 1.5 10-2 18-9 22 2 12-8 22-22 22H39C26 83 19 72 19 58Z" fill="currentColor"/>
      <path d="M19 58c-5 0-9 3-12 8 1-9 5-14 12-16Z" fill="currentColor" opacity=".72"/>
      <path d="M35 70c9-4 21-4 30 0 5 2 11 2 16 0-3 8-11 13-22 13-9 0-17-4-24-13Z" fill="#fff" opacity=".26"/>
      <path d="M64 48a3 3 0 1 0 6 0 3 3 0 1 0-6 0" fill="#fff"/>
      <path d="M72 57c3 2 6 2 9 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M52 27c0-5 3-8 8-9M52 27c-3-3-7-4-10-2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M82 30a2 2 0 1 0 4 0 2 2 0 1 0-4 0" fill="currentColor" opacity=".4"/>
      <path d="M88 38a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0" fill="currentColor" opacity=".28"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3.5 10.8 12 3.8l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M4.3 6.5h.2M4.3 12h.2M4.3 17.5h.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-ai" viewBox="0 0 24 24">
      <path d="m12 3 1.7 5.1L19 10l-5.3 1.9L12 17l-1.7-5.1L5 10l5.3-1.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M18.5 16.5 19 18l1.5.5-1.5.5-.5 1.5-.5-1.5L16.5 19l1.5-.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8.2" r="3.7" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4.8 20.2c.6-3.9 3.4-6 7.2-6s6.6 2.1 7.2 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6.5 6.5 11 11m0-11-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-left" viewBox="0 0 24 24">
      <path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-right" viewBox="0 0 24 24">
      <path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M6.5 16.5v-5a5.5 5.5 0 0 1 11 0v5l1.5 2h-14z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M10 21h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect x="5" y="10" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v9A2.5 2.5 0 0 0 6.5 18H8" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 4v10m0 0 3.5-3.5M12 14l-3.5-3.5M5 17.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M12 15V5m0 0 3.5 3.5M12 5 8.5 8.5M5 17.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9 7V5.2c0-.7.5-1.2 1.2-1.2h3.6c.7 0 1.2.5 1.2 1.2V7M6.5 7l.8 12.1c0 .5.5.9 1 .9h7.4c.5 0 .9-.4 1-.9L17.5 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.6-1.2-1.7-2.9-1.9.8c-.4-.3-.8-.6-1.3-.8L15.8 6h-3.4l-.3 1.9c-.5.2-.9.5-1.3.8l-1.9-.8-1.7 2.9L8.8 12c-.1.5-.1 1 0 1.5l-1.6 1.2 1.7 2.9 1.9-.8c.4.3.8.6 1.3.8l.3 1.9h3.4l.3-1.9c.5-.2.9-.5 1.3-.8l1.9.8 1.7-2.9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="m4 11.5 16-7-5.3 16-3.2-6.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="m11.5 14.2 4.2-4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M12 3.5 13.5 9 19 10.5 13.5 12 12 17.5 10.5 12 5 10.5 10.5 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M18.5 15.5 19 17l1.5.5-1.5.5-.5 1.5-.5-1.5L16.5 18l1.5-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24">
      <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M4 8h13.5M15.5 12.5h4.5v4h-4.5a2 2 0 0 1 0-4Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
      <path d="M4 19.5h16M6.5 16V11M11 16V6.5M15.5 16v-3.5M20 16V8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 11v5.2M12 7.8h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5V9h-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div id="app" class="app-shell">
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <button class="tab" data-tab="home" aria-label="首页">
        <svg class="ico"><use href="#i-home"></use></svg><span>首页</span>
      </button>
      <button class="tab" data-tab="records" aria-label="明细">
        <svg class="ico"><use href="#i-list"></use></svg><span>明细</span>
      </button>
      <button class="tab-add" data-action="open-add" data-type="expense" aria-label="记一笔">
        <svg class="ico"><use href="#i-plus"></use></svg>
      </button>
      <button class="tab" data-tab="ai" aria-label="鲸鲸 AI">
        <svg class="ico"><use href="#i-ai"></use></svg><span>鲸鲸 AI</span>
      </button>
      <button class="tab" data-tab="settings" aria-label="我的">
        <svg class="ico"><use href="#i-user"></use></svg><span>我的</span>
      </button>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-logo"><img class="mascot" src="img/mascot-rice.jpg" alt=""></div>
      <h1>哦鲸鲸记账</h1>
      <p>把每一笔，都变成底气</p>
      <div class="boot-dots"><i></i><i></i><i></i></div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
